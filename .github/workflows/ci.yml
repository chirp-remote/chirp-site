name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege by default: pull requests from forks would otherwise be
# handed a read/write token. A job that needs more asks for it explicitly.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Check, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Audit mode records what the job talks to without blocking it, and an
      # observer must not be able to fail the build it observes.
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        continue-on-error: true
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pages require Trusted Types, which not every browser enforces, and
      # carry their CSP twice: in a <meta> tag and, through Cloudflare, as a
      # header. This keeps HTML sinks out of site/ and the two policies equal.
      - name: No HTML sink, and one CSP
        run: ./scripts/check-site.sh

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      # The choices behind the site's moving parts, such as the hero bird's
      # hops, are kept apart from the page so they can be tested here.
      - name: Site scripts
        working-directory: site
        run: bun test

      - name: Assets shared with Chirp are fetched as pinned
        run: ./scripts/test-fetch-chirp-assets.sh

      # site/assets/link.test.js reads test/link-fragments.json; this checks
      # it is Chirp's, so the page and the app are held to the same cases.
      - name: Test cases are Chirp's
        run: ./scripts/check-chirp-vectors.sh

      - name: Build
        run: ./scripts/build-site.sh _site
