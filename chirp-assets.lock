# commit so the two cannot drift apart. scripts/fetch-chirp-assets.sh fetches
# each file from that commit and refuses it unless its SHA-256 is the one here.
# To follow a change in Chirp, set rev to the new commit and update the hashes
# of the files it changed.
#
